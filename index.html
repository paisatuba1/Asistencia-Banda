<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATRIL DIGITAL v6.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .hidden { display: none !important; }
        .flex { display: flex !important; }
        .loader { border-top-color: #0f172a; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .active-tab { border-bottom: 3px solid #0f172a; color: #0f172a; font-weight: 700; }
        input, select, textarea { border: 1px solid #e2e8f0 !important; outline: none; appearance: none; }
        .btn-status { font-size: 9px; font-weight: 600; padding: 12px 2px; border-radius: 8px; text-transform: uppercase; transition: 0.2s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .horario-grid { display: grid; grid-template-columns: 40px repeat(5, 1fr); gap: 1px; background: #cbd5e1; border: 1px solid #cbd5e1; }
        .horario-cell { min-height: 60px; padding: 4px; background: white; font-size: 10.5px; font-weight: 600; color: #334155; cursor: pointer; display: flex; align-items: center; justify-content: center; text-align: center; line-height: 1.2; }
        .horario-header { background: #0f172a; color: white; padding: 8px 0; text-align: center; font-size: 9px; font-weight: 700; text-transform: uppercase; }
        .input-std { width: 100%; height: 54px; padding: 0 1rem; background-color: #f8fafc; border-radius: 0.5rem; font-size: 15px; font-weight: 600; display: flex; align-items: center; }
    </style>
</head>
<body>

    <div id="loader" class="hidden fixed inset-0 bg-white/95 z-[9999] flex flex-col items-center justify-center text-center">
        <div class="loader rounded-full border-4 border-t-4 border-slate-200 h-12 w-12 mb-4"></div>
        <p id="loader-text" class="text-[12px] font-bold uppercase tracking-widest text-slate-500">INICIANDO...</p>
    </div>

    <div id="screen-login" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white p-10 rounded-3xl shadow-xl w-full max-w-sm text-center border border-slate-100">
            <img src="https://github.com/pandemiaproducciones/Atril-Digital/blob/main/logo.png?raw=true" class="w-24 mx-auto mb-6">
            <div class="flex items-center justify-center gap-2 mb-1">
                <h1 class="text-2xl font-bold uppercase tracking-tighter">ATRIL DIGITAL</h1>
                <span class="bg-slate-900 text-white text-[9px] px-2 py-0.5 rounded-full font-bold uppercase tracking-widest">v6.1</span>
            </div>
            <p class="text-slate-400 text-[11px] mb-8 font-semibold tracking-widest uppercase">SISTEMA INTEGRAL DE BANDAS</p>
            <div class="space-y-3">
                <input type="text" id="user-input" placeholder="USUARIO" class="w-full p-4 bg-slate-50 rounded-xl font-semibold text-[15px] uppercase">
                <input type="password" id="pass-input" placeholder="CONTRASEÑA" class="w-full p-4 bg-slate-50 rounded-xl text-2xl tracking-widest text-center">
                <button onclick="loginProcess()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[15px] active:scale-95 transition-transform">INGRESAR</button>
            </div>
            <p id="login-error" class="text-red-600 text-[12px] mt-6 hidden font-semibold uppercase">DATOS INCORRECTOS</p>
        </div>
    </div>

    <div id="screen-menu" class="hidden p-6 max-w-md mx-auto space-y-4">
        <div class="flex justify-between items-end mb-10 mt-6">
            <div>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-widest">BANDA SINFÓNICA</p>
                <h2 id="display-band-name" class="text-xl font-bold uppercase leading-none">---</h2>
            </div>
            <button onclick="logout()" class="border-2 border-red-500 text-red-500 px-4 py-2 rounded-xl text-[11px] font-bold uppercase">SALIR</button>
        </div>
        <button onclick="nav('screen-activity-menu')" class="w-full bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase text-slate-700">ASISTENCIA</span>
            <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-xl">📋</div>
        </button>
        <button onclick="nav('screen-student-menu')" class="w-full bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase text-slate-700">GESTIÓN ESTUDIANTES</span>
            <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-xl">👤</div>
        </button>
        <button onclick="nav('screen-inventory-menu')" class="w-full bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase text-slate-700">GESTIÓN INVENTARIO</span>
            <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-xl">🎷</div>
        </button>
        <button onclick="nav('screen-horario')" class="w-full bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase text-slate-700">HORARIO</span>
            <div class="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center text-xl">📅</div>
        </button>
    </div>

    <div id="screen-activity-menu" class="hidden p-6 max-w-md mx-auto space-y-4">
        <button onclick="nav('screen-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER AL MENÚ</button>
        <h2 class="text-xl font-bold uppercase text-slate-900 mb-6">ASISTENCIA</h2>
        <button onclick="nav('screen-activity-form')" class="w-full bg-slate-900 text-white p-8 rounded-2xl shadow-lg flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase">TOMAR ASISTENCIA +</span><span class="text-2xl">📋</span>
        </button>
        <button onclick="nav('screen-stats-filter')" class="w-full bg-white p-8 rounded-2xl shadow-sm border flex justify-between items-center">
            <span class="font-bold text-[15px] uppercase text-slate-700">ESTADÍSTICAS DE ASISTENCIA</span><span class="text-2xl">📊</span>
        </button>
    </div>

    <div id="screen-activity-form" class="hidden p-6 max-w-md mx-auto">
        <button onclick="nav('screen-activity-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER</button>
        <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 space-y-6">
            <h2 class="text-lg font-bold uppercase text-slate-900">DATOS DE LA JORNADA</h2>
            <input type="date" id="event-date" class="w-full h-[52px] px-4 bg-slate-50 rounded-xl font-semibold text-[15px]">
            <select id="event-type" onchange="toggleEventDesc()" class="w-full h-[52px] px-4 bg-slate-50 rounded-xl font-semibold text-[15px] uppercase">
                <option value="Ensayo">ENSAYO</option>
                <option value="Presentación">PRESENTACIÓN</option>
            </select>
            <div id="event-desc-box" class="hidden"><input type="text" id="event-desc" placeholder="NOMBRE DEL EVENTO" class="w-full p-4 bg-slate-50 rounded-xl font-semibold text-[15px] uppercase"></div>
            <button onclick="prepareProcess()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[13px]">CONTINUAR</button>
        </div>
    </div>

    <div id="screen-stats-filter" class="hidden p-6 max-w-md mx-auto">
        <button onclick="nav('screen-activity-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER</button>
        <div class="bg-white p-8 rounded-3xl shadow-xl space-y-6">
            <h2 class="text-lg font-bold uppercase text-slate-900">FILTRAR REPORTE</h2>
            <select id="stat-proceso" class="input-std"></select>
            <select id="stat-mes" class="input-std">
                <option value="1">ENERO</option><option value="2">FEBRERO</option><option value="3">MARZO</option>
                <option value="4">ABRIL</option><option value="5">MAYO</option><option value="6">JUNIO</option>
                <option value="7">JULIO</option><option value="8">AGOSTO</option><option value="9">SEPTIEMBRE</option>
                <option value="10">OCTUBRE</option><option value="11">NOVIEMBRE</option><option value="12">DICIEMBRE</option>
            </select>
            <button onclick="getReport()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[14px]">GENERAR REPORTE</button>
        </div>
    </div>

    <div id="screen-stats-report" class="hidden min-h-screen pb-20">
        <div class="bg-white p-6 sticky top-0 z-20 shadow-sm border-b">
            <button onclick="nav('screen-stats-filter')" class="text-slate-400 font-bold text-[12px] uppercase mb-4 block">← ATRÁS</button>
            <h2 id="report-title-text" class="font-bold text-lg uppercase leading-tight text-slate-900">REPORTE</h2>
            <p id="report-info-text" class="text-[11px] font-bold text-slate-400 uppercase mt-1">---</p>
        </div>
        <div id="stats-container" class="p-6 space-y-3"></div>
    </div>

    <div id="screen-process" class="hidden p-6 max-w-md mx-auto space-y-3">
        <button onclick="nav('screen-activity-form')" class="text-slate-400 font-bold mb-4 text-[12px] uppercase tracking-widest">← VOLVER</button>
        <div id="process-buttons" class="space-y-3"></div>
    </div>

    <div id="screen-list" class="hidden min-h-screen pb-44">
        <div class="bg-white p-6 sticky top-0 z-20 shadow-sm border-b">
            <div class="flex justify-between items-center mb-4">
                <button onclick="nav('screen-process')" class="text-slate-400 font-bold text-[12px] uppercase">← ATRÁS</button>
                <span id="counter" class="text-[11px] bg-slate-100 text-slate-500 px-3 py-1 rounded-full font-bold uppercase">0 Marcados</span>
            </div>
            <p id="info-header" class="font-bold text-[13px] uppercase mb-4 text-slate-400"></p>
            <div id="family-tabs" class="flex gap-4 overflow-x-auto no-scrollbar text-[12px] font-bold uppercase border-t pt-4">
                <button onclick="renderList('TODOS')" id="tab-TODOS" class="tab-btn active-tab pb-2">TODOS</button>
                <button onclick="renderList('Maderas')" id="tab-Maderas" class="tab-btn text-slate-300 pb-2">Maderas</button>
                <button onclick="renderList('Bronces')" id="tab-Bronces" class="tab-btn text-slate-300 pb-2">Bronces</button>
                <button onclick="renderList('Cuerdas')" id="tab-Cuerdas" class="tab-btn text-slate-300 pb-2">Cuerdas</button>
                <button onclick="renderList('Percusion')" id="tab-Percusion" class="tab-btn text-slate-300 pb-2">Percusión</button>
            </div>
        </div>
        <div id="musicos-box" class="p-6 space-y-3"></div>
        <div class="fixed bottom-0 bg-white/90 w-full p-4 border-t flex gap-2">
            <button onclick="generateWAReport()" class="flex-1 bg-green-600 text-white p-4 rounded-xl font-bold uppercase text-[11px]">REPORTE WA</button>
            <button onclick="finalize()" class="flex-1 bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[11px]">GUARDAR</button>
        </div>
    </div>

    <div id="screen-directory" class="hidden p-6 max-w-md mx-auto pb-20">
        <div class="sticky top-0 bg-[#f8fafc] z-10 pt-2 pb-4">
            <button onclick="nav('screen-student-menu')" class="text-slate-400 font-bold mb-4 text-[12px] uppercase tracking-widest">← VOLVER</button>
            <h2 class="text-lg font-bold uppercase text-slate-900 mb-4">BUSCAR ESTUDIANTE</h2>
            <input type="text" id="search-input" onkeyup="filterDirectory()" placeholder="Nombre o Instrumento..." class="w-full bg-white border border-slate-200 rounded-xl font-semibold text-[15px] shadow-sm p-4">
        </div>
        <div id="directory-list" class="space-y-3 mt-2"></div>
    </div>

    <div id="screen-student-menu" class="hidden p-6 max-w-md mx-auto space-y-4">
        <button onclick="nav('screen-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER AL MENÚ</button>
        <h2 class="text-xl font-bold uppercase text-slate-900 mb-6">GESTIÓN ESTUDIANTES</h2>
        <button onclick="prepareNewStudent()" class="w-full bg-slate-900 text-white p-8 rounded-2xl shadow-lg flex justify-between items-center"><span class="font-bold text-[15px] uppercase">AGREGAR ESTUDIANTE +</span><span class="text-2xl">📝</span></button>
        <button onclick="nav('screen-directory')" class="w-full bg-white p-8 rounded-2xl shadow-sm border flex justify-between items-center"><span class="font-bold text-[15px] uppercase text-slate-700">DIRECTORIO ESTUDIANTES</span><span class="text-2xl">📂</span></button>
    </div>

    <div id="screen-form-student" class="hidden p-6 max-w-md mx-auto pb-20">
        <button onclick="nav('screen-student-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER</button>
        <div class="bg-white p-8 rounded-3xl shadow-lg border border-slate-100 space-y-4">
            <h2 id="form-title" class="text-lg font-bold uppercase text-slate-900">ESTUDIANTE</h2>
            <input type="text" id="add-nombres" placeholder="Nombres" class="input-std">
            <input type="text" id="add-apellidos" placeholder="Apellidos" class="input-std">
            <input type="tel" id="add-telefono" placeholder="Teléfono" class="input-std">
            <div class="grid grid-cols-2 gap-2">
                <input type="tel" id="add-documento" placeholder="Documento" class="input-std">
                <input type="text" id="add-fecha_nacimiento" placeholder="dd/mm/aaaa" class="input-std uppercase">
            </div>
            <select id="add-proceso" class="input-std"></select>
            <select id="add-instrumento" class="input-std"></select>
            <select id="add-grado" class="input-std"></select>
            <button onclick="saveStudent()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[13px] mt-2">GUARDAR CAMBIOS</button>
            <button id="btn-del-student" onclick="deleteStudent()" class="hidden w-full bg-red-50 text-red-600 p-4 rounded-xl font-bold uppercase text-[13px] mt-6 border border-red-100">ELIMINAR ESTUDIANTE 🗑️</button>
        </div>
    </div>

    <div id="screen-horario" class="hidden p-4 max-w-xl mx-auto pb-32">
        <button onclick="nav('screen-menu')" class="text-slate-400 font-bold text-[12px] uppercase tracking-widest mb-6 block">← VOLVER</button>
        <div class="horario-grid">
            <div class="horario-header">H</div><div class="horario-header">LUN</div><div class="horario-header">MAR</div><div class="horario-header">MIE</div><div class="horario-header">JUE</div><div class="horario-header">VIE</div>
            <div id="horario-body" class="contents"></div>
        </div>
        <div class="fixed bottom-0 left-0 w-full p-6 bg-white/90 border-t">
            <button onclick="saveHorario()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[11px]">GUARDAR HORARIO</button>
        </div>
    </div>

    <div id="screen-inventory-menu" class="hidden p-6 max-w-md mx-auto space-y-4">
        <button onclick="nav('screen-menu')" class="text-slate-400 font-bold mb-6 text-[12px] uppercase tracking-widest">← VOLVER AL MENÚ</button>
        <h2 class="text-xl font-bold uppercase text-slate-900 mb-6">INVENTARIO</h2>
        <button onclick="prepareNewInstrument()" class="w-full bg-slate-900 text-white p-8 rounded-2xl shadow-lg flex justify-between items-center"><span class="font-bold text-[15px] uppercase">AGREGAR ACTIVO +</span><span class="text-2xl">🎺</span></button>
        <button onclick="openInventoryList()" class="w-full bg-white p-8 rounded-2xl shadow-sm border flex justify-between items-center"><span class="font-bold text-[15px] uppercase text-slate-700">VER INVENTARIO</span><span class="text-2xl">📦</span></button>
    </div>

    <script>
        const MOTOR_URL = "https://script.google.com/macros/s/AKfycbwpdHttIY9SWkliI5PVzsw-jS5b8-t6_IyS55hcmBWm2I4J1dJUCm1Iwm4EvrctlDRz7g/exec";
        
        let session = JSON.parse(localStorage.getItem('atril_v61')) || { user: "", banda: "", sheetId: "", master: [], config: {}, horario: [] };
        let record = {};
        let isEditing = false;
        let originalDoc = null;

        const SECCIONES = {
            "Maderas": ["flauta", "oboe", "fagot", "clarinete requinto", "clarinete soprano", "clarinete bajo", "saxofon soprano", "saxofon alto", "saxofon tenor", "saxofon baritono"],
            "Bronces": ["trompeta", "corno", "trombon", "eufonio", "tuba"],
            "Cuerdas": ["cello", "contrabajo", "violin", "viola"],
            "Percusion": ["percusion"]
        };
        const ORDEN_INST = [...SECCIONES.Maderas, ...SECCIONES.Bronces, ...SECCIONES.Cuerdas, ...SECCIONES.Percusion];

        window.onload = async () => { if(session.user) { loader(true, "SINCRONIZANDO..."); await fetchData(); } else { nav('screen-login'); } };

        function nav(id) {
            document.querySelectorAll('body > div').forEach(d => { if(d.id !== 'loader') d.classList.add('hidden'); d.classList.remove('flex'); });
            document.getElementById(id).classList.remove('hidden');
            if(id === 'screen-login') document.getElementById(id).classList.add('flex');
            if(id === 'screen-stats-filter') restoreStatsFilter();
            if(id === 'screen-horario') buildHorarioTable();
            if(id === 'screen-directory') filterDirectory();
        }

        function loader(v, t) {
            document.getElementById('loader-text').innerText = t || "CARGANDO...";
            document.getElementById('loader').classList.toggle('hidden', !v);
            document.getElementById('loader').classList.toggle('flex', v);
        }

        async function loginProcess() {
            const u = document.getElementById('user-input').value.trim(), p = document.getElementById('pass-input').value.trim();
            if(!u || !p) return;
            loader(true, "VERIFICANDO...");
            try {
                const r = await fetch(`${MOTOR_URL}?action=login&user=${encodeURIComponent(u)}&pass=${encodeURIComponent(p)}`);
                const d = await r.json();
                if(d.success) { session.user = u; session.banda = d.banda; session.sheetId = d.sheetId; await fetchData(); } 
                else { document.getElementById('login-error').classList.remove('hidden'); loader(false); }
            } catch(e) { alert("Error de conexión"); loader(false); }
        }

        async function fetchData() {
            try {
                const r = await fetch(`${MOTOR_URL}?action=getDataInicial&sheetId=${session.sheetId}`);
                const d = await r.json();
                if (d.success) { 
                    session.master = d.integrantes; 
                    session.config = d.config; 
                    session.horario = d.horario; 
                    localStorage.setItem('atril_v61', JSON.stringify(session));
                    document.getElementById('display-band-name').innerText = session.banda;
                    restoreFormOptions();
                    nav('screen-menu'); 
                } 
            } catch(e) { console.error(e); nav('screen-menu'); }
            loader(false);
        }

        function restoreFormOptions() {
            if(!session.config.proceso) return;
            ['proceso','instrumento','grado'].forEach(k => {
                const s = document.getElementById(`add-${k}`);
                if(s) s.innerHTML = `<option disabled selected>${k.toUpperCase()}</option>` + session.config[k].map(o => `<option value="${o}">${o}</option>`).join('');
            });
            document.getElementById('process-buttons').innerHTML = session.config.proceso.map(p => `<button onclick="initAt('${p}')" class="w-full p-6 bg-white rounded-2xl shadow-sm border font-bold text-left uppercase text-[13px] text-slate-700">${p}</button>`).join('');
        }

        // --- ASISTENCIA ---
        function toggleEventDesc() { document.getElementById('event-desc-box').classList.toggle('hidden', document.getElementById('event-type').value !== 'Presentación'); }
        function prepareProcess() {
            session.date = document.getElementById('event-date').value;
            session.act = (document.getElementById('event-type').value === 'Ensayo' ? 'ENSAYO' : document.getElementById('event-desc').value).toUpperCase();
            if(!session.date || !session.act) return alert("Faltan datos");
            nav('screen-process');
        }
        function initAt(p) { session.process = p; document.getElementById('info-header').innerText = `${p} • ${session.act}`; nav('screen-list'); renderList('TODOS'); }
        function renderList(secc) {
            const box = document.getElementById('musicos-box'); box.innerHTML = "";
            let filtrados = session.master.filter(m => m.proceso === session.process);
            if(secc !== 'TODOS') filtrados = filtrados.filter(m => SECCIONES[secc].includes(m.instrumento.toLowerCase()));
            filtrados.sort((a,b) => ORDEN_INST.indexOf(a.instrumento.toLowerCase()) - ORDEN_INST.indexOf(b.instrumento.toLowerCase()));
            filtrados.forEach(m => {
                const n = `${m.nombres} ${m.apellidos}`;
                const st = record[n] || '';
                const card = document.createElement('div'); card.className = "bg-white p-4 rounded-2xl shadow-sm border";
                card.innerHTML = `<div class="mb-3"><p class="font-bold text-[13px]">${n}</p><p class="text-[10px] font-bold text-slate-400 uppercase">${m.instrumento}</p></div>
                    <div class="grid grid-cols-4 gap-1">${['PRESENTE','AUSENTE','RETARDO','EXCUSA'].map(s => `<button onclick="mark('${n}','${s}')" class="btn-status border ${st === s ? getCol(s) : 'bg-slate-50 text-slate-400 border-slate-50'}">${s}</button>`).join('')}</div>`;
                box.appendChild(card);
            });
        }
        function mark(n, s) { if(record[n] === s) delete record[n]; else record[n] = s; document.getElementById('counter').innerText = `${Object.keys(record).length} Marcados`; renderList('TODOS'); }
        function getCol(s) { return {'PRESENTE':'bg-slate-900 text-white','AUSENTE':'bg-red-50 text-red-600','RETARDO':'bg-amber-50 text-amber-600','EXCUSA':'bg-blue-50 text-blue-600'}[s]; }
        async function finalize() {
            if(!Object.keys(record).length) return;
            loader(true, "GUARDANDO...");
            const data = Object.entries(record).map(([n, e]) => ({ fecha: session.date, tipo_actividad: document.getElementById('event-type').value, nombre_actividad: session.act, proceso: session.process, musico: n, estado: e }));
            const r = await fetch(MOTOR_URL, { method: 'POST', body: JSON.stringify({ action: 'saveAsistencia', sheetId: session.sheetId, asistencia: data }) });
            if((await r.json()).success) { alert("¡Guardado!"); record = {}; nav('screen-menu'); }
            loader(false);
        }

        // --- ESTADÍSTICAS ---
        function restoreStatsFilter() {
            document.getElementById('stat-proceso').innerHTML = session.config.proceso.map(p => `<option value="${p}">${p}</option>`).join('');
            document.getElementById('stat-mes').value = new Date().getMonth() + 1;
        }
        async function getReport() {
            const proc = document.getElementById('stat-proceso').value, mes = document.getElementById('stat-mes').value;
            loader(true, "CONSULTANDO...");
            const r = await fetch(`${MOTOR_URL}?action=getEstadisticas&sheetId=${session.sheetId}&proceso=${encodeURIComponent(proc)}&mes=${mes}`);
            const d = await r.json();
            if(d.success) {
                document.getElementById('report-title-text').innerText = proc;
                document.getElementById('report-info-text').innerText = `${document.getElementById('stat-mes').options[mes-1].text} • ${d.totalEventos} EVENTOS`;
                const box = document.getElementById('stats-container'); box.innerHTML = "";
                let masterProc = session.master.filter(m => m.proceso === proc).sort((a,b) => ORDEN_INST.indexOf(a.instrumento.toLowerCase()) - ORDEN_INST.indexOf(b.instrumento.toLowerCase()));
                masterProc.forEach(m => {
                    const n = `${m.nombres} ${m.apellidos}`, s = d.stats[n] || {P:0, A:0, R:0, E:0};
                    const pct = d.totalEventos > 0 ? Math.round(((parseInt(s.P)+parseInt(s.R))/d.totalEventos)*100) : 0;
                    const card = document.createElement('div'); card.className = "bg-white p-4 rounded-2xl border flex justify-between items-center";
                    card.innerHTML = `<div><p class="font-bold text-[13px]">${n}</p><p class="text-[9px] font-bold text-slate-400 uppercase">${m.instrumento}</p>
                        <div class="flex gap-2 mt-2 text-[10px] font-black"><span class="text-slate-900">P:${s.P}</span><span class="text-red-600">A:${s.A}</span><span class="text-amber-500">R:${s.R}</span></div></div>
                        <div class="text-right"><p class="text-xl font-black ${pct>=85?'text-green-600':(pct>=70?'text-amber-500':'text-red-600')}">${pct}%</p></div>`;
                    box.appendChild(card);
                });
                nav('screen-stats-report');
            }
            loader(false);
        }

        // --- DIRECTORIO ---
        function filterDirectory() {
            const q = document.getElementById('search-input').value.toLowerCase();
            const box = document.getElementById('directory-list'); box.innerHTML = "";
            session.master.filter(m => (m.nombres + " " + m.apellidos).toLowerCase().includes(q)).forEach(m => {
                const item = document.createElement('div'); item.className = "bg-white p-4 rounded-xl border flex justify-between items-center cursor-pointer";
                item.onclick = () => loadStudent(m);
                item.innerHTML = `<div><p class="font-bold text-[13px]">${m.nombres} ${m.apellidos}</p><p class="text-[10px] text-slate-400 uppercase font-bold">${m.instrumento}</p></div><div class="text-slate-300">✎</div>`;
                box.appendChild(item);
            });
        }
        function loadStudent(m) {
            isEditing = true; originalDoc = m.documento;
            document.getElementById('add-nombres').value = m.nombres; document.getElementById('add-apellidos').value = m.apellidos;
            document.getElementById('add-telefono').value = m.telefono; document.getElementById('add-documento').value = m.documento;
            document.getElementById('add-fecha_nacimiento').value = m.fecha_nacimiento; document.getElementById('add-proceso').value = m.proceso;
            document.getElementById('add-instrumento').value = m.instrumento; document.getElementById('add-grado').value = m.grado;
            document.getElementById('btn-del-student').classList.remove('hidden'); nav('screen-form-student');
        }

        // --- HORARIO ---
        function buildHorarioTable() {
            const body = document.getElementById('horario-body'); body.innerHTML = "";
            for(let h=1; h<=7; h++) {
                const rowHead = document.createElement('div'); rowHead.className="horario-header"; rowHead.innerText=h; body.appendChild(rowHead);
                for(let d=1; d<=5; d++) {
                    const cell = document.createElement('div'); cell.className="horario-cell";
                    const dayKey = ['lunes','martes','miercoles','jueves','viernes'][d-1];
                    if(session.horario[h-1] && session.horario[h-1][dayKey]) cell.innerText = session.horario[h-1][dayKey];
                    body.appendChild(cell);
                }
            }
        }

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
